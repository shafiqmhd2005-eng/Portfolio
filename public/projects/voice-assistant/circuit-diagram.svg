<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
<defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#14233a" flood-opacity=".12"/></filter>
 <style>
 text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17263c}.title{font-size:34px;font-weight:750}.sub{font-size:16px;fill:#63738a}.head{font-size:20px;font-weight:700}.label{font-size:15px;font-weight:650}.small{font-size:13px;fill:#52647a}.pin{font-size:13px;font-weight:600}.wire{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
 </style>
</defs>
<rect width="1600" height="1100" fill="#f4f7fb"/>
<text x="70" y="68" class="title">ESP32 audio + display wiring</text><text x="70" y="98" class="sub">30-pin ESP32 • INMP441 microphone • I²C OLED • MAX98357A amplifier • speaker</text>
<!-- Cards -->
<g filter="url(#shadow)">
 <rect x="75" y="150" width="520" height="800" rx="24" fill="#17263c"/>
 <rect x="680" y="150" width="400" height="300" rx="22" fill="#fff"/>
 <rect x="680" y="490" width="400" height="300" rx="22" fill="#fff"/>
 <rect x="680" y="830" width="400" height="120" rx="22" fill="#fff"/>
 <rect x="1210" y="830" width="310" height="210" rx="22" fill="#fff"/>
</g>
<!-- ESP32 board -->
<text x="110" y="195" font-size="21" font-weight="700" fill="#fff">ESP32 DEVKIT • 30 PIN</text>
<text x="110" y="222" font-size="13" fill="#aebbd0">GPIO pin numbers shown at the header</text>
<rect x="255" y="260" width="160" height="570" rx="26" fill="#243c59" stroke="#6682a3" stroke-width="2"/>
<rect x="295" y="295" width="80" height="104" rx="12" fill="#536b86"/>
<text x="335" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ESP32</text><text x="335" y="362" text-anchor="middle" font-size="12" fill="#d7e2ef">WROOM</text>
<rect x="305" y="460" width="60" height="90" rx="7" fill="#18293d" stroke="#7389a3"/>
<text x="335" y="510" text-anchor="middle" font-size="12" fill="#d7e2ef">USB</text>
<!-- left header -->
<g fill="#f2b84b">
 <circle cx="255" cy="290" r="5"/><circle cx="255" cy="326" r="5"/><circle cx="255" cy="362" r="5"/><circle cx="255" cy="398" r="5"/><circle cx="255" cy="434" r="5"/><circle cx="255" cy="470" r="5"/><circle cx="255" cy="506" r="5"/><circle cx="255" cy="542" r="5"/><circle cx="255" cy="578" r="5"/><circle cx="255" cy="614" r="5"/><circle cx="255" cy="650" r="5"/><circle cx="255" cy="686" r="5"/><circle cx="255" cy="722" r="5"/><circle cx="255" cy="758" r="5"/><circle cx="255" cy="794" r="5"/>
 <circle cx="415" cy="290" r="5"/><circle cx="415" cy="326" r="5"/><circle cx="415" cy="362" r="5"/><circle cx="415" cy="398" r="5"/><circle cx="415" cy="434" r="5"/><circle cx="415" cy="470" r="5"/><circle cx="415" cy="506" r="5"/><circle cx="415" cy="542" r="5"/><circle cx="415" cy="578" r="5"/><circle cx="415" cy="614" r="5"/><circle cx="415" cy="650" r="5"/><circle cx="415" cy="686" r="5"/><circle cx="415" cy="722" r="5"/><circle cx="415" cy="758" r="5"/><circle cx="415" cy="794" r="5"/>
</g>
<g font-size="12" fill="#d9e5f2">
 <text x="105" y="294">3V3</text><text x="105" y="330">GND</text><text x="105" y="366">GPIO15</text><text x="105" y="402">GPIO4</text><text x="105" y="438">GPIO2</text><text x="105" y="474">GPIO12</text><text x="105" y="510">GPIO13</text><text x="105" y="546">GPIO14</text><text x="105" y="582">GPIO27</text><text x="105" y="618">GPIO26</text><text x="105" y="654">GPIO25</text><text x="105" y="690">GPIO33</text><text x="105" y="726">GPIO32</text><text x="105" y="762">GPIO35</text><text x="105" y="798">GPIO34</text>
 <text x="435" y="294">VIN</text><text x="435" y="330">GND</text><text x="435" y="366">GPIO23</text><text x="435" y="402">GPIO22</text><text x="435" y="438">TX0</text><text x="435" y="474">RX0</text><text x="435" y="510">GPIO21</text><text x="435" y="546">GPIO19</text><text x="435" y="582">GPIO18</text><text x="435" y="618">GPIO5</text><text x="435" y="654">GPIO17</text><text x="435" y="690">GPIO16</text><text x="435" y="726">GPIO0</text><text x="435" y="762">GPIO1</text><text x="435" y="798">GPIO3</text>
</g>
<!-- signal and power routing -->
<path d="M415 290 H620 V260 H700" class="wire" stroke="#df4c4c"/><path d="M415 326 H630 V290 H700" class="wire" stroke="#596b82"/>
<path d="M415 290 H645 V340 H700" class="wire" stroke="#df4c4c"/><path d="M415 326 H655 V370 H700" class="wire" stroke="#596b82"/><path d="M255 726 H665 V400 H700" class="wire" stroke="#dba62d"/><path d="M255 366 H675 V430 H700" class="wire" stroke="#3979d4"/>
<path d="M415 290 H615 V600 H700" class="wire" stroke="#df4c4c"/><path d="M415 326 H625 V630 H700" class="wire" stroke="#596b82"/><path d="M255 726 H640 V660 H700" class="wire" stroke="#dba62d"/><path d="M255 614 H655 V690 H700" class="wire" stroke="#3979d4"/><path d="M255 650 H670 V730 H700" class="wire" stroke="#21a081"/>
<path d="M415 290 H610 V865 H700" class="wire" stroke="#df4c4c"/><path d="M415 326 H625 V895 H700" class="wire" stroke="#596b82"/><path d="M255 690 H645 V925 H700" class="wire" stroke="#9a64bd"/>
<!-- OLED -->
<text x="710" y="185" class="head">OLED DISPLAY • I²C</text><rect x="930" y="205" width="110" height="90" rx="8" fill="#203147"/><rect x="941" y="216" width="88" height="68" rx="4" fill="#b9f2df"/><path d="M955 235h55 M955 249h44 M955 263h50" stroke="#168c78" stroke-width="3"/>
<g class="pin"><text x="710" y="264">VCC  ←  3.3V</text><text x="710" y="294">GND  ←  GND</text><text x="710" y="344">SDA  ←  GPIO4</text><text x="710" y="384">SCL  ←  GPIO15</text></g><text x="710" y="425" class="small">Common 4-pin I²C OLED module</text>
<!-- mic -->
<text x="710" y="525" class="head">INMP441 • I²S MICROPHONE</text><rect x="944" y="560" width="94" height="94" rx="47" fill="#23384f"/><circle cx="991" cy="607" r="30" fill="#344f6d"/><circle cx="991" cy="607" r="17" fill="#111d2b"/><circle cx="991" cy="607" r="5" fill="#5e7794"/>
<g class="pin"><text x="710" y="584">VDD  ←  3.3V</text><text x="710" y="614">GND  ←  GND</text><text x="710" y="654">SD  ←  GPIO32</text><text x="710" y="694">SCK  ←  GPIO26</text><text x="710" y="734">WS  ←  GPIO25</text><text x="910" y="734">L/R  →  GND</text></g><text x="710" y="770" class="small">WS is labeled “SW” in your pin list</text>
<!-- amp -->
<text x="710" y="865" class="head">MAX98357A • I²S AMPLIFIER</text><g class="pin"><text x="710" y="895">VIN ← 3.3V</text><text x="830" y="895">GND ← GND</text><text x="710" y="925">LRC ← GPIO33</text><text x="850" y="925">DIN ← GPIO27</text><text x="710" y="945">BCLK ← GPIO14</text><text x="900" y="945">GAIN: NC</text></g>
<!-- speaker -->
<text x="1240" y="865" class="head">SPEAKER</text><path d="M1290 915 L1340 915 L1402 870 L1402 1025 L1340 980 L1290 980 Z" fill="#35506e"/><path d="M1422 895 Q1475 947 1422 999 M1440 877 Q1510 947 1440 1017" fill="none" stroke="#6a86a7" stroke-width="6" stroke-linecap="round"/>
<circle cx="1250" cy="1010" r="9" fill="#d94848"/><circle cx="1295" cy="1010" r="9" fill="#25384d"/><text x="1270" y="1037" text-anchor="middle" class="small">SPK+  /  SPK−</text>
<path d="M1080 895 H1160 V1010 H1250" class="wire" stroke="#d94848"/><path d="M1080 925 H1180 V1030 H1295" class="wire" stroke="#596b82"/>
<rect x="75" y="1070" width="1450" height="70" rx="16" fill="#e8eef6"/><text x="105" y="1100" class="label">Wiring notes</text><text x="105" y="1125" class="small">Use one shared GND between ESP32 and all modules. Connect the speaker only to amplifier SPK+ and SPK−. OLED pin order can vary by board; follow its printed labels.</text>
</svg>
